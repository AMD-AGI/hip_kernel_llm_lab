model_name_or_path: Qwen/Qwen3-14B
trust_remote_code: true
#auto_resume: true
 
### method
stage: pt
do_train: true
finetuning_type: full
deepspeed: train_yamls/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]
 
### dataset
dataset: pretrain_v3
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 256
dataloader_num_workers: 256
 
### output
output_dir: save/Qwen3-14B/cpt
logging_steps: 1
save_steps: 300
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]
 
### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
 
### eval
val_size: 0.01
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 250000